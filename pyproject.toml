[project]
name = "sks-ai"
version = "0.1.0"
description = "随口说 Python AI 服务（FastAPI + LangGraph，仅内网）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-openai>=0.2",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    # 短 ASR（paraformer）+ 长转写（qwen3-asr-flash）——dashscope / 百炼 API Key。
    "dashscope>=1.17",
    # 内容安全 Green 文本审核（AcsClient）。长转写已不再走 filetrans；勿删此依赖。
    "aliyun-python-sdk-core>=2.16",
    "pydub>=0.25",
    # FastAPI 文件上传（/ai/asr multipart）所需。
    "python-multipart>=0.0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# 视频号 WASM 资产（非 .py）必须打进 wheel，否则 prod 镜像缺 decrypt runtime。
[tool.hatch.build.targets.wheel.force-include]
"app/datasource/media/wechat_wasm" = "app/datasource/media/wechat_wasm"

[tool.uv]
# 仅约束 dev 依赖（测试用）
# 使用 PEP 735 dependency-groups（uv 0.11+ 推荐）；Dockerfile `uv sync --no-dev` 兼容。
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "testcontainers[postgres]>=4.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
